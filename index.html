<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Aplica o tema salvo (e a versão simples) antes da primeira pintura: nada pisca.
         No celular a versão simples é o padrão até a pessoa escolher (mesma regra de simpleMode.ts). -->
    <script>
      var html = document.documentElement;
      var simple = null;
      try {
        var theme = localStorage.getItem('portfolio-theme');
        var accent = localStorage.getItem('portfolio-accent');
        if (/^(latte|frappe|macchiato|mocha)$/.test(theme)) html.setAttribute('data-theme', theme);
        if (/^[a-z]+$/.test(accent)) html.style.setProperty('--ctp-accent', 'var(--ctp-' + accent + ')');
        simple = localStorage.getItem('portfolio-simples');
      } catch (error) {}
      if (simple === 'on' || (simple === null && matchMedia('(max-width: 767px), (pointer: coarse) and (max-height: 520px)').matches))
        html.setAttribute('data-simple', '');
    </script>
    <!-- Título, descrição, Open Graph e JSON-LD de cada página: gerados por src/seo.ts. -->
    <!--seo--><title>Dev Full Stack Júnior · Otávio Kessler Ustra</title><!--/seo-->
    <meta name="author" content="Otávio Kessler Ustra" />
    <meta name="theme-color" content="#1e1e2e" />
    <!-- ícones: o Google usa o primeiro que achar (quadrado, múltiplo de 48 px); /favicon.ico é o que ele procura antes -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
